

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 100%;
            max-width: 350px;
            padding: 24px;
            border-radius: 28px;
            background: #1c1c1e;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .header span:last-child {
            color: #4ade80;
        }

        .display {
            width: 100%;
            min-height: 115px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 12px 4px 24px;
            overflow: hidden;
        }

        #expression {
            width: 100%;
            min-height: 24px;
            color: #999;
            text-align: right;
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        #screen {
            width: 100%;
            color: #fff;
            text-align: right;
            font-size: clamp(36px, 10vw, 52px);
            font-weight: 300;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #screen::-webkit-scrollbar {
            display: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        button {
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            font-size: 23px;
            cursor: pointer;
            color: white;
            background: #333336;
            transition: background 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #505054;
        }

        button:active {
            transform: scale(0.92);
        }

        .utility {
            background: #a5a5a5;
            color: #171717;
        }

        .utility:hover {
            background: #d0d0d0;
        }

        .operator {
            background: #ff9f0a;
            color: white;
        }

        .operator:hover {
            background: #ffb340;
        }

        .operator.selected {
            background: white;
            color: #ff9f0a;
        }

        .equals {
            background: #ff9f0a;
        }

        .equals:hover {
            background: #ffb340;
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 50px;
            text-align: left;
            padding-left: 28px;
        }

        #status {
            min-height: 18px;
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 380px) {
            .calculator {
                padding: 18px;
            }

            .buttons {
                gap: 9px;
            }

            button {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="calculator">
        <div class="header">
            <span>JAVA CALCULATOR</span>
            <span>● ONLINE</span>
        </div>

        <div class="display">
            <div id="expression" aria-label="Expression"></div>
            <div id="screen" role="status"
                 aria-live="polite">0</div>
        </div>

        <div class="buttons">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="delete"
                    aria-label="Delete last digit">DEL</button>
            <button class="utility" data-action="sign">+/−</button>
            <button class="operator" data-op="divide">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-op="multiply">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-op="subtract">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-op="add">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>
        </div>

        <div id="status">Powered by Java &amp; Spring Boot</div>
    </main>

    <script>
        const screen = document.getElementById("screen");
        const expression = document.getElementById("expression");
        const status = document.getElementById("status");
        const buttons = document.querySelector(".buttons");

        let currentInput = "0";
        let firstOperand = null;
        let operator = null;
        let shouldResetScreen = false;
        let lastOperation = null;
        let requestInProgress = false;

        const symbols = {
            add: "+",
            subtract: "−",
            multiply: "×",
            divide: "÷"
        };

        function updateDisplay() {
            screen.textContent = currentInput;
        }

        function clearSelection() {
            document.querySelectorAll(".operator")
                .forEach(button => {
                    button.classList.remove("selected");
                });
        }

        function showError(message) {
            status.style.color = "#ff6b6b";
            status.textContent = message;
        }

        function showStatus(message) {
            status.style.color = "#4ade80";
            status.textContent = message;
        }

        function enterNumber(number) {
            if (shouldResetScreen) {
                currentInput = number;
                shouldResetScreen = false;
            } else if (currentInput === "0") {
                currentInput = number;
            } else if (currentInput === "-0") {
                currentInput = "-" + number;
            } else if (currentInput.length < 16) {
                currentInput += number;
            }

            updateDisplay();
        }

        function enterDecimal() {
            if (shouldResetScreen) {
                currentInput = "0";
                shouldResetScreen = false;
            }

            if (!currentInput.includes(".")) {
                currentInput += ".";
            }

            updateDisplay();
        }

        function toggleSign() {
            if (currentInput === "0") return;

            currentInput = currentInput.startsWith("-")
                ? currentInput.slice(1)
                : "-" + currentInput;

            updateDisplay();
        }

        function deleteDigit() {
            if (shouldResetScreen) return;

            currentInput = currentInput.length <= 1 ||
                (currentInput.length === 2 &&
                 currentInput.startsWith("-"))
                ? "0"
                : currentInput.slice(0, -1);

            updateDisplay();
        }

        function clearCalculator() {
            currentInput = "0";
            firstOperand = null;
            operator = null;
            shouldResetScreen = false;
            lastOperation = null;

            expression.textContent = "";
            clearSelection();
            updateDisplay();
            showStatus("Powered by Java & Spring Boot");
        }

        function chooseOperator(nextOperator) {
            if (requestInProgress) return;

            const value = Number(currentInput);

            if (!Number.isFinite(value)) {
                showError("Please enter a valid number.");
                return;
            }

            if (operator !== null && !shouldResetScreen) {
                calculate();
                return;
            }

            firstOperand = value;
            operator = nextOperator;
            lastOperation = null;
            shouldResetScreen = true;

            expression.textContent =
                `${currentInput} ${symbols[operator]}`;

            clearSelection();

            const activeButton = document.querySelector(
                `[data-op="${nextOperator}"]`
            );

            if (activeButton) {
                activeButton.classList.add("selected");
            }

            showStatus("Ready");
        }

        async function calculate() {
            if (requestInProgress) return;

            let num1;
            let num2;
            let operation;

            if (operator !== null) {
                if (shouldResetScreen) return;

                num1 = firstOperand;
                num2 = Number(currentInput);
                operation = operator;

                lastOperation = {
                    operator: operation,
                    operand: num2
                };
            } else if (lastOperation !== null) {
                num1 = Number(currentInput);
                num2 = lastOperation.operand;
                operation = lastOperation.operator;
            } else {
                return;
            }

            const first = num1;
            const second = num2;
            const op = operation;

            expression.textContent =
                `${first} ${symbols[op]} ${second} =`;

            requestInProgress = true;

            document.querySelectorAll(".buttons button")
                .forEach(button => button.disabled = true);

            showStatus("Calculating...");

            try {
                const params = new URLSearchParams({
                    num1: String(first),
                    num2: String(second),
                    operator: op
                });

                const response = await fetch(
                    `/calculate?${params.toString()}`
                );

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(
                        data.error || "Calculation failed."
                    );
                }

                const result = Number(data.result);

                if (!Number.isFinite(result)) {
                    throw new Error("Invalid result from server.");
                }

                currentInput = String(result);
                firstOperand = null;
                operator = null;
                shouldResetScreen = true;

                updateDisplay();
                clearSelection();
                showStatus("Calculation successful");

            } catch (error) {
                showError(
                    error.message || "Unable to contact server."
                );

                // Allow the user to correct the calculation.
                if (operator === null) {
                    operator = op;
                    firstOperand = first;
                    currentInput = String(second);
                    shouldResetScreen = false;
                }

            } finally {
                requestInProgress = false;

                document.querySelectorAll(".buttons button")
                    .forEach(button => button.disabled = false);
            }
        }

        buttons.addEventListener("click", event => {
            const button = event.target.closest("button");

            if (!button || requestInProgress) return;

            if (button.dataset.number !== undefined) {
                enterNumber(button.dataset.number);
                return;
            }

            if (button.dataset.op) {
                chooseOperator(button.dataset.op);
                return;
            }

            switch (button.dataset.action) {
                case "clear":
                    clearCalculator();
                    break;
                case "delete":
                    deleteDigit();
                    break;
                case "sign":
                    toggleSign();
                    break;
                case "decimal":
                    enterDecimal();
                    break;
                case "equals":
                    calculate();
                    break;
            }
        });

        // Optional keyboard support
        document.addEventListener("keydown", event => {
            if (requestInProgress) return;

            if (/^[0-9]$/.test(event.key)) {
                enterNumber(event.key);
            } else if (event.key === ".") {
                enterDecimal();
            } else if (event.key === "Backspace") {
                deleteDigit();
            } else if (event.key === "Escape") {
                clearCalculator();
            } else if (event.key === "Enter" ||
                       event.key === "=") {
                calculate();
            } else if (event.key === "+") {
                chooseOperator("add");
            } else if (event.key === "-") {
                chooseOperator("subtract");
            } else if (event.key === "*") {
                chooseOperator("multiply");
            } else if (event.key === "/") {
                event.preventDefault();
                chooseOperator("divide");
            }
        });
    </script>
</body>
</html>
